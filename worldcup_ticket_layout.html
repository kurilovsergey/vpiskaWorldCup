<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIFA World Cup 2026 Ticket</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#111}
  .phone{width:738px;height:1516px;margin:0 auto;background:linear-gradient(90deg,#21d4dc 0,#ecfffe 16px,#fff 54px,#fff 684px,#eaffff 710px,#22d5de 738px);position:relative;overflow:hidden}
  .phone:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(75deg,rgba(0,190,220,.10) 0 2px,transparent 2px 9px);opacity:.45;pointer-events:none}
  .topbar{height:122px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;font-size:31px;font-weight:700;letter-spacing:.2px;box-shadow:0 10px 30px rgba(0,0,0,.04)}
  .back{position:absolute;left:28px;top:53px;width:28px;height:28px;border-left:5px solid #111;border-bottom:5px solid #111;transform:rotate(45deg);border-radius:2px}.dot{position:absolute;bottom:23px;width:11px;height:11px;background:#111;border-radius:50%}
  .notice{margin:0 14px;height:206px;background:rgba(255,255,255,.83);border-radius:0 0 18px 18px;position:relative;z-index:1;text-align:center;padding-top:73px;border-bottom:1px dashed #b8a8c7;color:#675970}.notice:before,.notice:after{content:"";position:absolute;top:0;width:14px;height:206px;background:#23d6dc}.notice:before{left:0}.notice:after{right:0}.notice h2{margin:0 0 15px;font-size:25px;font-weight:500;letter-spacing:1px}.notice p{margin:0;font-size:21px}.info{position:absolute;right:35px;top:22px;width:32px;height:32px;border:3px solid #8f8496;border-radius:50%;font-size:21px;line-height:27px;font-weight:700}
  .card{position:relative;z-index:1;margin:0 15px;height:1126px;background:rgba(255,255,255,.92);border-radius:20px;box-shadow:0 0 0 1px rgba(0,0,0,.06);padding-top:128px;text-align:center;overflow:hidden}.card:before{content:"";position:absolute;right:-85px;top:-125px;width:230px;height:230px;border-radius:50%;border:1px solid rgba(200,200,210,.4);background:rgba(244,244,248,.8)}
  .matchno{position:absolute;right:30px;top:47px;width:76px;height:76px;border-radius:50%;background:#f2f2f6;color:#050505;font-size:26px;display:flex;align-items:center;justify-content:center}.logo{margin:0 auto 58px;width:352px;height:188px;background:#030303;border-radius:92px 92px 0 92px;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;letter-spacing:1px;line-height:.96;box-shadow:inset 0 0 0 2px #111}.logo span:nth-child(1){font-size:36px}.logo span:nth-child(2){font-size:43px}.logo span:nth-child(3){font-size:45px}.title{font-size:41px;font-weight:650;margin-bottom:35px;letter-spacing:-.5px}.meta{color:#665b72;font-size:25px;line-height:1.8;margin-bottom:43px}.ico{display:inline-block;width:25px;text-align:center;margin-right:10px;opacity:.88}.grid{display:grid;grid-template-columns:1.12fr .58fr .7fr .7fr;gap:8px;margin:0 50px 21px}.box{height:127px;background:rgba(250,250,253,.78);border:1px solid rgba(228,228,235,.65);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center}.box label{font-size:21px;line-height:1.2;color:#7b6f82;text-transform:uppercase;font-weight:500}.box strong{font-size:38px;font-weight:400;margin-top:15px}.smallgrid{display:grid;grid-template-columns:108px 142px;gap:8px;justify-content:center}.smallgrid .box{height:127px}.separator{border-top:2px dashed #d1c6d8;margin:45px 35px 0}.details{margin:47px 38px 0;color:#958b9e;font-size:21px;text-transform:uppercase;letter-spacing:.7px}.row{display:grid;grid-template-columns:1fr 1fr;text-align:left;margin-bottom:28px}.row div:last-child{text-align:right;color:#8b8193;font-weight:500}.row.name div:last-child{font-size:22px;color:#777080}.row.cat{font-size:20px;text-transform:none}.row.cat div:first-child{text-transform:uppercase}.row.cat div:last-child{font-size:25px;color:#8d8492;text-transform:none}.float{position:absolute;right:16px;bottom:18px;width:88px;height:88px;border-radius:50%;background:#020202;box-shadow:0 2px 10px rgba(0,0,0,.3)}.float:after{content:"⋮";color:white;font-size:44px;line-height:76px}.noise{position:absolute;inset:0;background:radial-gradient(circle at 60% 48%,rgba(255,255,255,.16),transparent 42%);pointer-events:none}
  @media(max-width:760px){.phone{width:100vw;height:205.42vw;transform-origin:top left}.topbar{height:16.53vw}.notice{height:27.91vw}.card{height:152.57vw}.logo{width:47.7vw;height:25.47vw}}
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar"><div class="back"></div>Ticket 1 of 1<div class="dot"></div></div>
    <section class="notice"><div class="info">i</div><h2>THE TICKET IS NOT YET READY</h2><p>It will be activated on the day of the match</p></section>
    <main class="card">
      <div class="matchno">36</div>
      <div class="logo"><span>FIFA</span><span>WORLD CUP</span><span>2026</span></div>
      <div class="title">M36 Tunisia vs Japan</div>
      <div class="meta"><div><span class="ico">▣</span>20 JUN 26, 22:00</div><div><span class="ico">⌖</span>Monterrey Stadium</div></div>
      <div class="grid">
        <div class="box"><label>Entrance<br>Ingreso</label><strong>B/C/D/E</strong></div>
        <div class="box"><label>Gate<br>Puerta</label><strong>P6</strong></div>
        <div class="box"><label>Stairs<br>Escalera</label><strong>7</strong></div>
        <div class="box"><label>Section<br>Sección</label><strong>231</strong></div>
      </div>
      <div class="smallgrid"><div class="box"><label>Row<br>Fila</label><strong>Z</strong></div><div class="box"><label>Seat<br>Asiento</label><strong>9</strong></div></div>
      <div class="separator"></div>
      <div class="details">
        <div class="row name"><div>Ticket Holder</div><div>SERGEI KURILOV</div></div>
        <div class="row cat"><div>Category</div><div>Category 3</div></div>
      </div>
      <div class="float"></div><div class="noise"></div>
    </main>
  </div>
</body>
</html>
